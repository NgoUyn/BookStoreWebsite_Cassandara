<head th:fragment="head(pageTitle, includeChart)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">BOOKOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link th:href="@{/tailadmin-style.css}" rel="stylesheet" />
    <th:block th:if="${includeChart}">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </th:block>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-peach': '#F8D9C0',
                        'brand-cream': '#FAF5E8',
                        'brand-biscuit': '#D19C74',
                        'brand-dark': '#5D4037',
                        'brand-accent': '#E5CBB5',
                        'brand-orange': '#ea580c'
                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        /* Dashboard specific styles */
        .stat-card {
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(93, 64, 55, 0.1);
        }
        .period-btn {
            transition: all 0.2s ease;
        }
        .period-btn.active-period {
            background-color: #D19C74;
            color: white;
            border-color: #D19C74;
        }
        .period-btn:not(.active-period):hover {
            background-color: #FAF5E8;
        }
        .chart-container {
            transition: all 0.3s ease;
        }
        .chart-container:hover {
            box-shadow: 0 4px 20px rgba(93, 64, 55, 0.06);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dash-section {
            animation: fadeInUp 0.5s ease forwards;
        }
        .dash-section:nth-child(2) { animation-delay: 0.1s; }
        .dash-section:nth-child(3) { animation-delay: 0.2s; }
        .dash-section:nth-child(4) { animation-delay: 0.3s; }
        .dash-section:nth-child(5) { animation-delay: 0.4s; }
        .dash-section:nth-child(6) { animation-delay: 0.5s; }
    </style>
    <script src="https://unpkg.com/flowbite@1.7.0/dist/flowbite.bundle.js" defer></script>
</head>
