<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel_head :: head('BOOKOM SELLER - Đơn hàng', false)}"></head>
<body class="font-sans bg-[#fbfaf8] text-[#5D4037]">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/seller_layout :: sidebar(${activeMenu})}"></div>
    <div class="flex-1 min-w-0">
        <div th:replace="~{fragments/seller_layout :: header(${pageTitle}, ${pageSubtitle})}"></div>
        <main class="p-4 md:p-8 space-y-6">
            <section class="rounded-xl border border-[#E5CBB5] bg-white p-4 grid grid-cols-1 md:grid-cols-2 gap-3">
                <input id="orders-q" class="rounded-lg border border-[#E5CBB5] px-3 py-2 font-bold" placeholder="Tìm mã đơn hàng/sản phẩm">
                <select id="orders-status" class="rounded-lg border border-[#E5CBB5] px-3 py-2 font-bold">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="PROCESSING">Đang xác nhận</option>
                    <option value="COMFIRMED">Đã xác nhận</option>
                    <option value="SHIPPING">Đang giao</option>
                    <option value="COMPLETED">Đã hoàn thành</option>
                    <option value="CANCELLED">Đã hủy</option>
                </select>
            </section>
            <section class="rounded-xl border border-[#E5CBB5] bg-white overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-[#FAF5E8] text-[#5D4037]/70"><tr>
                            <th class="px-4 py-3 font-black">Mã đơn</th>
                            <th class="px-4 py-3 font-black">Khách hàng</th>
                            <th class="px-4 py-3 font-black">Sản phẩm</th>
                            <th class="px-4 py-3 font-black">Tổng đơn</th>
                            <th class="px-4 py-3 font-black">Trạng thái</th>
                            <th class="px-4 py-3 font-black text-right">Hành động</th>
                        </tr></thead>
                        <tbody id="seller-orders-body" class="divide-y divide-[#E5CBB5]"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/panel-data.js}"></script>
<script th:src="@{/js/api-service.js}"></script>
<script th:src="@{/js/seller-dashboard-integration.js}"></script>
<script>
// Load seller orders with new API integration
if (typeof loadSellerOrders === 'function') {
    loadSellerOrders();
} else {
    BookomPanelData.initSellerOrders();
}

// Load ML customer data for DevTools
(function() {
    'use strict';
    const API_ROOT = '/api';

    function loadMLData() {
        var userId = localStorage.getItem('userId');
        if (!userId) return;

        fetch(API_ROOT + '/seller/customers', {
            headers: {
                'Content-Type': 'application/json',
                'X-User-Id': userId
            }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var customers = Array.isArray(data) ? data : [];
            if (customers.length > 0) {
                console.log('%c🧠 ML Customer Analysis (Seller Orders)', 'font-size:16px; font-weight:bold; color:#ea580c;');
                console.table(customers.map(function(c) {
                    return {
                        Name: c.username || 'N/A',
                        Email: c.email || 'N/A',
                        Label: c.predictedLabel,
                        Risk: c.riskLevel,
                        ChurnProb: c.churnProbability ? (c.churnProbability * 100).toFixed(1) + '%' : '--',
                        LastAnalyzed: c.lastAnalyzedAt || '--'
                    };
                }));
            }
        })
        .catch(function(err) {
            console.log('%c⚠ ML data not available: ' + err.message, 'color:orange');
        });
    }

    setTimeout(loadMLData, 2000);
})();
</script>
</body>
REPLACE
</html>
