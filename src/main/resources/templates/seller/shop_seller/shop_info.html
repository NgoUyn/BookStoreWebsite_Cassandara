<section th:fragment="shop_info" class="max-w-[1400px] mx-auto">
    <div id="shop-banner-host" class="w-full h-48 md:h-64 relative overflow-hidden bg-brand-dark"
         th:style="${shop?.bannerUrl != null} ? 'background-image: url(' + ${shop.bannerUrl} + '); background-size: cover; background-position: center;' : ''">
        <div class="absolute inset-0 bg-brand-brown opacity-20"></div>
        <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#fff 2px, transparent 2px); background-size: 30px 30px;"></div>
        <div class="absolute inset-0 shop-banner-mask"></div>
    </div>

    <div class="max-w-[1400px] mx-auto px-6 relative">
        <div class="flex flex-col md:flex-row items-end md:items-center gap-6 md:gap-10 -mt-16 md:-mt-20 pb-8 relative z-10">

            <div class="bg-white p-4 md:p-6 rounded-xl shadow-premium flex flex-col sm:flex-row items-center sm:items-start gap-6 w-full md:w-auto border border-brand-border">
                <div class="w-28 h-28 rounded-full bg-brand-hero border-4 border-white shadow-md flex-shrink-0 flex items-center justify-center overflow-hidden relative group cursor-pointer">
                    <img id="shop-display-logo" class="hidden w-full h-full object-cover" src="" alt="Shop logo" />
                    <div id="shop-display-initials" class="text-brand-brown font-extrabold text-3xl">NN</div>
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <span class="text-white text-xs font-bold">Xem ảnh</span>
                    </div>
                </div>

                <div class="flex flex-col justify-center items-center sm:items-start text-center sm:text-left pt-2">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="bg-brand-orange text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">VIP Mall</span>
                        <h1 id="shop-display-name" class="text-2xl md:text-3xl font-bold text-brand-dark" th:text="${shop?.shopName}">Nhã Nam Official</h1>
                    </div>
                    <p id="shop-display-status" class="text-sm text-gray-500 font-medium mb-4 flex items-center gap-1">
                        <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Gian hàng chính hãng
                    </p>

                    <div class="flex gap-3 w-full sm:w-auto flex-wrap sm:flex-nowrap">
                        <button class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-white border border-brand-brown text-brand-brown text-sm font-bold px-4 sm:px-6 py-2 rounded-lg hover:bg-brand-hero transition-colors shadow-sm uppercase whitespace-nowrap">
                            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                            Chat ngay
                        </button>
                        <button class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-brand-brown text-white text-sm font-bold px-4 sm:px-6 py-2 rounded-lg hover:bg-brand-brown-dark transition-colors shadow-sm uppercase whitespace-nowrap">
                            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Theo dõi
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex-grow w-full bg-white/60 backdrop-blur-md border border-brand-border/50 rounded-xl p-6 grid grid-cols-2 lg:grid-cols-4 gap-6 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 rounded-full bg-brand-hero text-brand-brown"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg></div>
                    <div>
                        <div class="text-xs text-gray-500 font-medium">Sản phẩm</div>
                        <div id="shop-product-count" class="text-brand-orange font-bold text-lg" th:text="${bookCount}">1,245</div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="p-2.5 rounded-full bg-brand-hero text-brand-brown"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg></div>
                    <div>
                        <div class="text-xs text-gray-500 font-medium">Người theo dõi</div>
                        <div class="text-brand-orange font-bold text-lg" th:text="${#numbers.formatInteger(shop?.followerCount != null ? shop.followerCount : 0, 0, 'COMMA')}">145.2k</div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="p-2.5 rounded-full bg-brand-hero text-brand-brown"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg></div>
                    <div>
                        <div class="text-xs text-gray-500 font-medium">Đánh giá</div>
                        <div class="text-brand-orange font-bold text-lg">
                            <span th:text="${#numbers.formatDecimal(shop?.rating != null ? shop.rating : 0, 1, 1)}">4.9</span>
                            <span class="text-xs text-gray-500" th:if="${shop?.ratingCount != null && shop.ratingCount > 0}" th:text="'(' + ${#numbers.formatInteger(shop.ratingCount, 0, 'COMMA')} + ')'">(24k)</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="p-2.5 rounded-full bg-brand-hero text-brand-brown"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>
                    <div>
                        <div class="text-xs text-gray-500 font-medium">Tham gia</div>
                        <div class="text-brand-dark font-bold text-lg" th:text="${joinDuration}">4 năm</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
