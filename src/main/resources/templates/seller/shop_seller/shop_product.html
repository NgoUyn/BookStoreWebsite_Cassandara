<section th:fragment="shop_product" class="max-w-[1400px] mx-auto px-6 pt-10 pb-4">
    <!-- Loading state -->
    <div id="products-loading" class="text-center py-8 text-gray-400 font-semibold">
        <svg class="animate-spin inline-block w-6 h-6 mr-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Đang tải sản phẩm...
    </div>

    <!-- Empty state -->
    <div id="products-empty" class="hidden text-center py-8 text-gray-400 font-semibold border-2 border-dashed border-brand-border rounded-xl">
        Shop chưa có sản phẩm nào.
    </div>

    <!-- Error state -->
    <div id="products-error" class="hidden text-center py-8 text-red-400 font-semibold border-2 border-dashed border-red-200 rounded-xl">
        Không thể tải sản phẩm.
    </div>

    <!-- Products grid rendered by JS -->
    <div id="products-container" class="hidden grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

    <!-- Progress counter & Load more button -->
    <div id="products-footer" class="hidden flex flex-col items-center gap-4 mt-8">
        <div id="products-progress" class="text-sm text-gray-500 font-medium">
            Đã xem <span id="products-loaded-count">0</span> / <span id="products-total-count">0</span> sản phẩm
        </div>
        <button id="products-load-more"
                class="bg-white border-2 border-brand-brown text-brand-brown font-bold px-8 py-3 rounded-xl hover:bg-brand-hero transition-colors shadow-sm uppercase tracking-wide text-sm">
            Xem thêm
        </button>
    </div>
</section>
