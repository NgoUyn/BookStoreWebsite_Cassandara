<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel_head :: head('BOOKOM SELLER - Tin nhan', true)}"></head>
<body class="font-sans bg-[#fbfaf8] text-[#5D4037]">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/seller_layout :: sidebar(${activeMenu})}"></div>
    <div class="flex-1 min-w-0 flex flex-col">
        <div th:replace="~{fragments/seller_layout :: header(${pageTitle}, ${pageSubtitle})}"></div>
        <main class="flex-1 p-4 md:p-6">
            <div class="bg-white rounded-xl border border-[#E5CBB5] shadow-sm overflow-hidden flex h-[calc(100vh-12rem)]">

                <div id="seller-chat-left-panel" class="w-full md:w-80 lg:w-96 border-r border-[#E5CBB5] flex flex-col flex-shrink-0">
                    <div class="p-3 border-b border-[#E5CBB5]">
                        <div class="relative">
                            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                            <input id="seller-chat-search" type="text" class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none focus:border-[#D19C74] focus:bg-white transition" placeholder="Tìm kiếm nhắn...">
                        </div>
                    </div>

                    <div id="seller-room-list" class="flex-1 overflow-y-auto">
                        <div class="text-center text-gray-400 text-sm py-10">Đang tải...</div>
                    </div>
                </div>

                <div id="seller-chat-right-panel" class="flex-1 flex flex-col min-w-0 bg-gray-50 relative">
                    <div id="seller-chat-empty" class="absolute inset-0 flex items-center justify-center bg-white z-10">
                        <div class="text-center">
                            <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                            </svg>
                            <p class="text-gray-400 font-medium">Chọn một cuộc hội thoại</p>
                            <p class="text-gray-300 text-sm mt-1">Để xem và trả lời tin nhắn</p>
                        </div>
                    </div>

                    <div id="seller-chat-content" class="hidden flex-1 flex flex-col min-h-0 bg-white">
                        <div class="px-4 py-3 border-b border-[#E5CBB5] flex items-center gap-3 bg-white flex-shrink-0">
                            <button id="seller-chat-back" class="md:hidden p-1 hover:bg-gray-100 rounded text-gray-500">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                                </svg>
                            </button>
                            <div class="w-9 h-9 rounded-full bg-[#D19C74] text-white flex items-center justify-center text-sm font-bold flex-shrink-0" id="seller-chat-header-avatar">NN</div>
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-sm text-[#5D4037]" id="seller-chat-header-name">Người mua</div>
                                <div class="text-xs text-gray-400 truncate" id="seller-chat-header-product">Sản phẩm</div>
                            </div>
                        </div>

                        <div id="seller-product-card" class="hidden bg-gray-50 border-b border-gray-200 p-3 flex items-center gap-3 flex-shrink-0">
                            <img id="seller-product-img" class="w-10 h-14 object-cover rounded border" src="" alt="">
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-bold text-gray-800 truncate" id="seller-product-title">Tên sản phẩm</div>
                                <div class="text-[#D19C74] font-bold text-sm" id="seller-product-price">0đ</div>
                            </div>
                            <a id="seller-product-link" href="#" class="text-xs text-blue-600 hover:underline flex-shrink-0" target="_blank">Xem sản phẩm</a>
                        </div>

                        <div class="flex-1 relative flex flex-col min-h-0 bg-gray-50">
                            <div id="seller-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 pb-24 scroll-smooth">
                                <div class="text-center text-gray-400 text-sm py-10">Đang tải tin nhắn...</div>
                            </div>

                            <div id="seller-chat-input-wrapper" class="absolute bottom-0 left-0 right-0 pt-6 bg-gradient-to-t from-gray-50 via-gray-50/95 to-transparent z-20 pointer-events-none">
                                <form id="seller-chat-input-form" class="flex gap-2 bg-white rounded-lg shadow-lg border border-gray-200 p-2 mx-4 mb-4 pointer-events-auto">
                                    <input id="seller-chat-input" type="text" class="flex-1 border-0 bg-transparent px-2 py-2 text-sm outline-none placeholder-gray-400 focus:ring-0" placeholder="Nhập tin nhắn..." autocomplete="off">
                                    <button type="submit" class="bg-[#D19C74] text-white px-5 py-2 rounded-lg hover:bg-[#b58d67] transition text-sm font-bold flex items-center gap-1 shadow-sm flex-shrink-0">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                                        </svg>
                                        Gửi
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="/js/api-service.js"></script>
<script src="/js/chat-service.js"></script>
<script src="/js/chat-ui.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var serverAuthUserId = /*[[${authUserId}]]*/ null;
    var serverAuthRole = /*[[${authUserRole}]]*/ null;
    var serverAuthToken = /*[[${authAccessToken}]]*/ null;

    if (serverAuthUserId && !localStorage.getItem('userId')) {
        localStorage.setItem('userId', serverAuthUserId);
    }
    if (serverAuthRole && !localStorage.getItem('userRole')) {
        localStorage.setItem('userRole', serverAuthRole);
    }
    if (serverAuthToken && !localStorage.getItem('accessToken')) {
        localStorage.setItem('accessToken', serverAuthToken);
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (window.ChatUI && typeof window.ChatUI.initSellerChat === 'function') {
            window.ChatUI.initSellerChat();

            // Mobile Responsive Event Handling
            const leftPanel = document.getElementById('seller-chat-left-panel');
            const rightPanel = document.getElementById('seller-chat-right-panel');
            const backBtn = document.getElementById('seller-chat-back');
            const roomList = document.getElementById('seller-room-list');

            roomList?.addEventListener('click', (e) => {
                const item = e.target.closest('.room-item');
                if (item && window.innerWidth < 768) {
                    leftPanel?.classList.add('hidden');
                }
            });

            backBtn?.addEventListener('click', () => {
                if (window.innerWidth < 768) {
                    leftPanel?.classList.remove('hidden');
                }
            });
        }
    });
    /*]]>*/
</script>
</body>
</html>
