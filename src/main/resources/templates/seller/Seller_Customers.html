<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel_head :: head(${pageTitle}, false)}"></head>
<body class="font-sans bg-[#fbfaf8] text-[#5D4037]">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/seller_layout :: sidebar(${activeMenu})}"></div>
    <div class="flex-1 min-w-0">
        <div th:replace="~{fragments/seller_layout :: header(${pageTitle}, ${pageSubtitle})}"></div>
        <main class="p-4 md:p-8 space-y-6">

            <!-- ============================================ -->
            <!-- STAT CARDS: Tổng quan ML cho seller           -->
            <!-- ============================================ -->
            <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 md:gap-6">
                <article class="rounded-xl border border-[#E5CBB5] bg-white p-5">
                    <div class="flex items-center gap-4">
                        <div class="flex-shrink-0 w-12 h-12 rounded-full bg-[#FAF5E8] flex items-center justify-center">
                            <svg class="w-6 h-6 text-[#D19C74]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-black text-[#5D4037]/60 uppercase tracking-wider">Khách hàng</p>
                            <p id="stat-total" class="mt-1 text-xl md:text-2xl font-black text-[#5D4037]">--</p>
                        </div>
                    </div>
                </article>
                <article class="rounded-xl border border-[#E5CBB5] bg-white p-5">
                    <div class="flex items-center gap-4">
                        <div class="flex-shrink-0 w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center">
                            <svg class="w-6 h-6 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-black text-[#5D4037]/60 uppercase tracking-wider">Nguy cơ rời bỏ</p>
                            <p id="stat-churn" class="mt-1 text-xl md:text-2xl font-black text-rose-600">--</p>
                        </div>
                    </div>
                </article>
                <article class="rounded-xl border border-[#E5CBB5] bg-white p-5">
                    <div class="flex items-center gap-4">
                        <div class="flex-shrink-0 w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center">
                            <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-black text-[#5D4037]/60 uppercase tracking-wider">An toàn</p>
                            <p id="stat-safe" class="mt-1 text-xl md:text-2xl font-black text-emerald-600">--</p>
                        </div>
                    </div>
                </article>
                <article class="rounded-xl border border-[#E5CBB5] bg-[#FAF5E8] p-5">
                    <div class="flex items-center gap-4">
                        <div class="flex-shrink-0 w-12 h-12 rounded-full bg-white flex items-center justify-center">
                            <svg class="w-6 h-6 text-[#ea580c]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-black text-[#5D4037]/60 uppercase tracking-wider">Đã phân tích</p>
                            <p id="stat-analyzed" class="mt-1 text-xl md:text-2xl font-black text-[#ea580c]">--</p>
                        </div>
                    </div>
                </article>
            </section>

            <!-- ============================================ -->
            <!-- FILTERS                                       -->
            <!-- ============================================ -->
            <section class="rounded-xl border border-[#E5CBB5] bg-white p-4 grid grid-cols-1 md:grid-cols-3 gap-3">
                <input id="customers-q" class="rounded-lg border border-[#E5CBB5] px-3 py-2 font-bold" placeholder="Tìm tên hoặc email khách hàng...">
                <select id="customers-risk" class="rounded-lg border border-[#E5CBB5] px-3 py-2 font-bold">
                    <option value="all">Tất cả mức rủi ro</option>
                    <option value="LOW">An toàn (Low)</option>
                    <option value="HIGH">Nguy cơ cao (High)</option>
                    <option value="Not analyzed">Chưa phân tích</option>
                </select>
                <select id="customers-label" class="rounded-lg border border-[#E5CBB5] px-3 py-2 font-bold">
                    <option value="all">Tất cả nhãn</option>
                    <option value="0">Ở lại (Stay)</option>
                    <option value="1">Rời bỏ (Churn)</option>
                </select>
            </section>

            <!-- ============================================ -->
            <!-- TABLE: Danh sách khách hàng của seller        -->
            <!-- ============================================ -->
            <section class="rounded-xl border border-[#E5CBB5] bg-white overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-[#FAF5E8] text-[#5D4037]/70">
                            <tr>
                                <th class="px-4 py-3 font-black">Tên</th>
                                <th class="px-4 py-3 font-black">Email</th>
                                <th class="px-4 py-3 font-black">Dự đoán</th>
                                <th class="px-4 py-3 font-black">Rủi ro</th>
                                <th class="px-4 py-3 font-black">Churn Prob</th>
                                <th class="px-4 py-3 font-black">Chiến lược giữ chân</th>
                                <th class="px-4 py-3 font-black text-right">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="seller-customers-body" class="divide-y divide-[#E5CBB5]">
                            <tr><td colspan="7" class="px-4 py-10 text-center text-gray-400 font-bold">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>
</div>
<script th:src="@{/js/panel-data.js}"></script>
<script th:src="@{/js/api-service.js}"></script>
<script>
(function() {
    'use strict';

    const API_ROOT = '/api';

    // ==========================================
    // AUTH HEADERS (pattern chuẩn từ panel-data.js)
    // ==========================================
    function authHeaders() {
        var token = localStorage.getItem('accessToken') || localStorage.getItem('access_token') ||
            sessionStorage.getItem('accessToken') || sessionStorage.getItem('access_token');
        var headers = {
            'Content-Type': 'application/json'
        };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return headers;
    }

    // ==========================================
    // UTILITY
    // ==========================================
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s || '').replace(/[&<>"']/g, function(c) {
        return {'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c];
    });}
    function pct(n) { return (n !== null && n !== undefined) ? (n * 100).toFixed(1) + '%' : '--'; }

    // ==========================================
    // RETENTION STRATEGIES (model mới: predictedLabel 0/1 + riskLevel LOW/HIGH)
    // ==========================================
    function getRetentionStrategy(predictedLabel, riskLevel) {
        var strategies = {
            '0_LOW': '🎁 Tặng voucher tri ân, chương trình tích điểm',
            '0_HIGH': '📧 Gửi email khuyến mãi, re-engagement',
            '1_LOW': '🔥 Giảm giá đặc biệt, hỗ trợ ưu tiên',
            '1_HIGH': '📞 Can thiệp ngay: gọi điện, tặng quà, ưu đãi lớn'
        };
        return strategies[predictedLabel + '_' + riskLevel] || '📊 Theo dõi thêm';
    }

    function getRiskBadge(riskLevel) {
        var map = {
            'LOW': '<span class="inline-block rounded-full bg-emerald-100 text-emerald-700 px-3 py-1 text-xs font-black">An toàn</span>',
            'HIGH': '<span class="inline-block rounded-full bg-rose-100 text-rose-700 px-3 py-1 text-xs font-black">Nguy cơ cao</span>'
        };
        return map[riskLevel] || '<span class="inline-block rounded-full bg-gray-100 text-gray-500 px-3 py-1 text-xs font-black">Chưa có</span>';
    }

    function getLabelBadge(predictedLabel) {
        if (predictedLabel === null || predictedLabel === undefined) return '<span class="text-gray-400">--</span>';
        if (predictedLabel === 0) return '<span class="inline-block rounded-full bg-emerald-100 text-emerald-700 px-3 py-1 text-xs font-black">✅ Ở lại</span>';
        return '<span class="inline-block rounded-full bg-rose-100 text-rose-700 px-3 py-1 text-xs font-black">⚠ Rời bỏ</span>';
    }

    // ==========================================
    // LOAD DATA
    // ==========================================
    function loadCustomers() {
        var q = $('customers-q') ? $('customers-q').value : '';
        var risk = $('customers-risk') ? $('customers-risk').value : 'all';
        var label = $('customers-label') ? $('customers-label').value : 'all';

        var url = API_ROOT + '/seller/customers';
        if (q || risk !== 'all' || label !== 'all') {
            url += '?' + new URLSearchParams({ q: q, risk: risk, label: label }).toString();
        }

        fetch(url, { headers: authHeaders() })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var customers = Array.isArray(data) ? data : [];
            renderTable(customers);
            renderStats(customers);
            // DevTools: log ML data to console
            console.log('%c🧠 ML Customer Analysis - Seller View', 'font-size:16px; font-weight:bold; color:#ea580c;');
            console.table(customers.map(function(c) {
                return {
                    Name: c.username || 'N/A',
                    Email: c.email || 'N/A',
                    Label: c.predictedLabel,
                    Risk: c.riskLevel,
                    ChurnProb: c.churnProbability,
                    Strategy: getRetentionStrategy(c.predictedLabel, c.riskLevel)
                };
            }));
        })
        .catch(function(err) {
            console.error('Failed to load customers:', err);
            $('seller-customers-body').innerHTML = '<tr><td colspan="7" class="px-4 py-10 text-center text-red-400 font-bold">Lỗi tải dữ liệu: ' + esc(err.message) + '</td></tr>';
        });
    }

    function renderStats(customers) {
        var total = customers.length;
        var analyzed = customers.filter(function(c) { return c.predictedLabel !== null && c.predictedLabel !== undefined; }).length;
        var churn = customers.filter(function(c) { return c.riskLevel === 'HIGH'; }).length;
        var safe = customers.filter(function(c) { return c.riskLevel === 'LOW'; }).length;

        $('stat-total').textContent = total;
        $('stat-analyzed').textContent = analyzed;
        $('stat-churn').textContent = churn;
        $('stat-safe').textContent = safe;
    }

    function renderTable(customers) {
        if (!customers.length) {
            $('seller-customers-body').innerHTML = '<tr><td colspan="7" class="px-4 py-10 text-center text-gray-400 font-bold">Chưa có khách hàng nào mua hàng từ shop của bạn</td></tr>';
            return;
        }

        $('seller-customers-body').innerHTML = customers.map(function(c) {
            var strategy = getRetentionStrategy(c.predictedLabel, c.riskLevel);
            return '<tr>' +
                '<td class="px-4 py-3 font-bold">' + esc(c.username || 'N/A') + '</td>' +
                '<td class="px-4 py-3 text-gray-500">' + esc(c.email || 'N/A') + '</td>' +
                '<td class="px-4 py-3">' + getLabelBadge(c.predictedLabel) + '</td>' +
                '<td class="px-4 py-3">' + getRiskBadge(c.riskLevel) + '</td>' +
                '<td class="px-4 py-3 font-bold">' + pct(c.churnProbability) + '</td>' +
                '<td class="px-4 py-3 text-xs max-w-[200px]">' + esc(strategy) + '</td>' +
                '<td class="px-4 py-3 text-right">' +
                    '<button class="rounded border border-brand-accent px-3 py-1 text-xs font-black hover:bg-[#FAF5E8] transition" onclick="analyzeCustomer(' + c.userId + ')">Phân tích</button>' +
                '</td>' +
            '</tr>';
        }).join('');
    }

    // ==========================================
    // ACTIONS
    // ==========================================
    window.analyzeCustomer = function(userId) {
        fetch(API_ROOT + '/seller/customers/' + userId + '/analyze', {
            method: 'POST',
            headers: authHeaders()
        })
        .then(function(r) {
            if (!r.ok) {
                return r.text().then(function(text) {
                    throw new Error(text);
                });
            }
            return r.json();
        })
        .then(function(result) {
            console.log('✅ Analysis result for user ' + userId + ':', result);
            loadCustomers();
            if (window.BookomToast) BookomToast.success('Phân tích thành công!');
        })
        .catch(function(err) {
            console.log('%c========== 🐍 DEBUG: LỖI GỌI PYTHON ML API ==========', 'font-size:14px; font-weight:bold; color:red;');
            console.log('%cRequest body gửi lên Python (từ error response):', 'font-weight:bold;');
            console.log(err.message);
            console.log('%c==========================================================', 'color:red;');
            console.error('Analysis failed:', err);
            if (window.BookomToast) BookomToast.error('Phân tích thất bại: ' + err.message);
        });
    };


    // ==========================================
    // INIT
    // ==========================================
    function init() {
        loadCustomers();

        if ($('customers-q')) $('customers-q').addEventListener('input', loadCustomers);
        if ($('customers-risk')) $('customers-risk').addEventListener('change', loadCustomers);
        if ($('customers-label')) $('customers-label').addEventListener('change', loadCustomers);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
