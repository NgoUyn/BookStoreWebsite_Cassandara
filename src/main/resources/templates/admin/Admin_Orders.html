<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel_head :: head(${pageTitle}, false)}"></head>
<body class="font-sans bg-[#fbfaf8] text-[#5D4037]">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/admin_layout :: sidebar(${activeMenu})}"></div>
    <div class="flex-1 min-w-0">
        <div th:replace="~{fragments/admin_layout :: header(${pageTitle}, ${pageSubtitle})}"></div>
        <main class="p-4 md:p-8 space-y-6">
            <!-- Filters -->
            <section class="rounded-2xl border border-[#E5CBB5] bg-white p-6 shadow-sm flex flex-wrap gap-4">
                <div class="flex-1 min-w-[200px] relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input id="orders-q" class="w-full rounded-xl border border-[#E5CBB5] pl-10 pr-4 py-2.5 font-bold focus:ring-2 focus:ring-[#D19C74] focus:outline-none transition-all" placeholder="Tìm mã đơn hoặc tên khách hàng...">
                </div>
                <select id="orders-status" class="rounded-xl border border-[#E5CBB5] px-4 py-2.5 font-bold text-[#5D4037] focus:ring-2 focus:ring-[#D19C74] focus:outline-none transition-all cursor-pointer bg-white">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="PROCESSING">Đang xác nhận</option>
                    <option value="COMFIRMED">Đã xác nhận</option>
                    <option value="SHIPPING">Đang giao</option>
                    <option value="COMPLETED">Đã hoàn thành</option>
                    <option value="CANCELLED">Đã hủy</option>
                </select>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-gray-400 uppercase">Từ:</span>
                    <input id="orders-date-from" type="date" class="rounded-xl border border-[#E5CBB5] px-4 py-2 font-bold text-[#5D4037] focus:ring-2 focus:ring-[#D19C74] focus:outline-none transition-all">
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-gray-400 uppercase">Đến:</span>
                    <input id="orders-date-to" type="date" class="rounded-xl border border-[#E5CBB5] px-4 py-2 font-bold text-[#5D4037] focus:ring-2 focus:ring-[#D19C74] focus:outline-none transition-all">
                </div>
            </section>

            <!-- Orders Table -->
            <section class="rounded-2xl border border-[#E5CBB5] bg-white shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-[#FAF5E8] text-[#5D4037]/70 border-b border-[#E5CBB5]">
                            <tr>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Mã đơn hàng</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Khách hàng</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Tổng thanh toán</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Địa chỉ nhận</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Trạng thái</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Ngày đặt</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px] text-right">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="admin-orders-body" class="divide-y divide-[#E5CBB5]">
                            <tr><td colspan="7" class="px-6 py-10 text-center text-gray-400 font-bold">Đang tải danh sách đơn hàng...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

<!-- Modal chi tiết đơn hàng (Sẽ implement sau) -->

<script th:src="@{/js/panel-data.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (window.BookomPanelData && window.BookomPanelData.initAdminOrders) {
            window.BookomPanelData.initAdminOrders();
        }
    });
</script>
</body>
</html>
