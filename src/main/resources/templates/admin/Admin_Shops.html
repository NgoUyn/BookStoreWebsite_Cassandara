<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel_head :: head(${pageTitle}, false)}"></head>
<body class="font-sans bg-[#fbfaf8] text-[#5D4037]">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/admin_layout :: sidebar(${activeMenu})}"></div>
    <div class="flex-1 min-w-0">
        <div th:replace="~{fragments/admin_layout :: header(${pageTitle}, ${pageSubtitle})}"></div>
        <main class="p-4 md:p-8 space-y-6">
            <section class="rounded-2xl border border-[#E5CBB5] bg-white p-6 shadow-sm">
                <div class="relative max-w-2xl">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input id="shops-q" class="w-full rounded-xl border border-[#E5CBB5] pl-10 pr-4 py-2.5 font-bold focus:ring-2 focus:ring-[#D19C74] focus:outline-none transition-all" placeholder="Tìm tên gian hàng, chủ shop hoặc mã số thuế...">
                </div>
            </section>
            
            <section class="rounded-2xl border border-[#E5CBB5] bg-white shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-[#FAF5E8] text-[#5D4037]/70 border-b border-[#E5CBB5]">
                            <tr>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Tên gian hàng</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Chủ sở hữu</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Hồ sơ pháp lý</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Sản phẩm</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Ngày tham gia</th>
                                <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px] text-right">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="admin-shops-body" class="divide-y divide-[#E5CBB5]">
                            <tr><td colspan="6" class="px-6 py-10 text-center text-gray-400 font-bold">Đang tải danh sách gian hàng...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/panel-data.js}"></script>
<script>BookomPanelData.initAdminShops();</script>
</body>
</html>
