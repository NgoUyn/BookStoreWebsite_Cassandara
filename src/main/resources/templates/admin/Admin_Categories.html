<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel_head :: head(${pageTitle}, false)}"></head>
<body class="font-sans bg-[#fbfaf8] text-[#5D4037]">
<div class="flex min-h-screen">
    <div th:replace="~{fragments/admin_layout :: sidebar(${activeMenu})}"></div>
    <div class="flex-1 min-w-0">
        <div th:replace="~{fragments/admin_layout :: header(${pageTitle}, ${pageSubtitle})}"></div>
        <main class="p-4 md:p-8 space-y-6">
            <!-- Form thêm danh mục mới -->
            <section class="rounded-2xl border border-[#E5CBB5] bg-white p-6 shadow-sm">
                <h3 class="text-lg font-black mb-4 text-[#ea580c]">Thêm danh mục mới</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label for="create-category-name" class="text-xs font-black uppercase text-gray-500">Tên danh mục</label>
                        <input id="create-category-name" class="w-full rounded-xl border border-[#E5CBB5] px-4 py-2.5 font-bold focus:ring-2 focus:ring-[#D19C74] focus:outline-none transition-all" placeholder="Ví dụ: Văn học, Kinh tế...">
                    </div>
                    <div class="space-y-1">
                        <label for="create-category-desc" class="text-xs font-black uppercase text-gray-500">Mô tả (không bắt buộc)</label>
                        <input id="create-category-desc" class="w-full rounded-xl border border-[#E5CBB5] px-4 py-2.5 font-bold focus:ring-2 focus:ring-[#D19C74] focus:outline-none transition-all" placeholder="Mô tả ngắn về danh mục này">
                    </div>
                </div>
                <div class="mt-4 flex justify-end">
                    <button id="create-category-btn" class="rounded-xl bg-[#ea580c] px-6 py-2.5 text-white font-black hover:bg-[#d14d0a] transition-all shadow-md active:scale-95">
                        Thêm danh mục
                    </button>
                </div>
            </section>

            <!-- Danh sách danh mục -->
            <section class="rounded-2xl border border-[#E5CBB5] bg-white shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-[#FAF5E8] text-[#5D4037]/70 border-b border-[#E5CBB5]">
                        <tr>
                            <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Tên danh mục</th>
                            <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px]">Mô tả</th>
                            <th class="px-6 py-4 font-black uppercase tracking-wider text-[10px] text-right">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="admin-categories-body" class="divide-y divide-[#E5CBB5]">
                        <tr><td colspan="3" class="px-6 py-10 text-center text-gray-400 font-bold">Đang tải danh sách danh mục...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/panel-data.js}"></script>
<script>
    if (window.BookomPanelData && BookomPanelData.initAdminCategories) {
        BookomPanelData.initAdminCategories();
    }
</script>
</body>
</html>
