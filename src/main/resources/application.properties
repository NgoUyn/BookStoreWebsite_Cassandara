spring.application.name=BookStore
spring.config.import=optional:file:.env[.properties]
firebase.config.path=classpath:firebase-service-account.json

# Gemini API key
google.gemini.api-key=${GOOGLE_AI_KEY:${GEMINI_API_KEY:${google.gemini.api-key.local:MISSING_KEY}}}

# Set to true on first run to seed sample data, then set back to false
app.seeder.enabled=false
app.seeder.max-books=300
app.seeder.ai-enabled=false
# Duong dan file CSV sach (dataset Book-Crossing). Khong dong goi vao JAR
# (73MB) - dat file o db/seed/Books.csv; neu thieu se thu doc tu classpath /Books.csv
app.seeder.books-csv=db/seed/Books.csv

# Gmail config for OTP delivery
# bao gio dung OTP thi chuyen True
management.health.mail.enabled=true
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:${spring.mail.username:no-reply@bookstore.local}}

jwt.refresh.expiration=604800000

server.address=0.0.0.0

# ==============================================================================
# DISTRIBUTED SYSTEM CONFIGURATION
# ==============================================================================

# Graceful shutdown: allow max 30s for in-flight requests to complete
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Distributed lock configuration for queue worker coordination
distributed.lock.enabled=true
distributed.lock.name=NOTIFICATION_QUEUE_WORKER
distributed.lock.ttl-seconds=30

# Heartbeat configuration: send heartbeat every 15 seconds (= TTL / 2)
app.heartbeat.interval-seconds=15
app.heartbeat.enabled=true

# ==============================================================================
# CONNECTION POOL TUNING
# ==============================================================================

# Luu y: HikariCP/DataSource da bi go bo cung JPA.
# Pool cua MongoDB duoc cau hinh o dong `spring.data.mongodb.uri-options.maxPoolSize`
# (xem muc MONGODB ben duoi).


ml.api.url=http://localhost:8000/api/v1/predict


#ml.api.url=http://host.docker.internal:8000/api/v1/predict



# ===============================
#  VNPAY PAYMENT GATEWAY
# ===============================
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:https://d64e-xxx-xx.ngrok-free.app/api/payment/vnpay-callback}




# (Flyway da duoc go bo: migration & index duoc quan ly bang MongoDB + db/mongo/*.js)

# ==============================================================================
# MONGODB  (migration target - do an NoSQL)
# ==============================================================================
# Instance rieng cua do an: single-node REPLICA SET (bat buoc de dung
# multi-document transaction + change stream). Khoi dong bang:
#     tools\mongo-dev-start.bat
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27018/bookom?replicaSet=rs0}
spring.data.mongodb.database=${MONGODB_DATABASE:bookom}
spring.data.mongodb.grid-fs-database=${MONGODB_DATABASE:bookom}
# Index duoc quan ly bang code (db/mongo/02_indexes.js + MongoIndexInitializer)
# nen TAT auto-index-creation de tranh index "moi" ngoai y muon.
spring.data.mongodb.auto-index-creation=false
# Connection pool (tuong duong HikariCP ben SQL Server)
spring.data.mongodb.uri-options.maxPoolSize=20
app.mongo.id-assignment.enabled=true
app.mongo.sequence.initial-value=1
app.mongo.index-verify-on-startup=true

# ------------------------------------------------------------------------------
# MONGODB DEV AUTOSTART (chi co tac dung khi chay main -> bam Run 1 lan la chay het)
# ------------------------------------------------------------------------------
# BookStoreApplication.main() goi MongoDevBootstrap truoc SpringApplication.run:
#   - cong 27018 chua mo  -> tu start mongod.exe (hoac docker compose)
#   - replica set chua init -> chay db/mongo/00_init_replica_set.js
#   - DB/collection rong -> chay 01 (collection+validator) + 02 (index) + 03 (danh muc)
#     + 11 (100 nha ban that); rieng 248k sach phai bat seed.books=true vi mat vai phut
#   - khong dung toi cong 27017, khong xoa du lieu, khong tat mongod khi app dung
# TAT: --app.mongo.autostart.enabled=false  hoac env APP_MONGO_AUTOSTART=false
# KHONG anh huong test: @SpringBootTest/@DataMongoTest khong goi main().
app.mongo.autostart.enabled=true
# auto = uu tien mongod.exe cua may, khong co thi dung docker compose | native | docker
app.mongo.autostart.mode=auto
app.mongo.autostart.host=127.0.0.1
app.mongo.autostart.port=27018
app.mongo.autostart.replica-set=rs0
app.mongo.autostart.database=bookom
app.mongo.autostart.db-path=D:/mongo-data/rs0
app.mongo.autostart.mongod-exe=C:/Program Files/MongoDB/Server/8.3/bin/mongod.exe
# De trong = tu do %LOCALAPPDATA%\Programs\mongosh\mongosh.exe roi den PATH
app.mongo.autostart.mongosh-exe=
# De trong = tu do C:\Program Files\MongoDB\Tools\<version>\bin (mongoimport)
app.mongo.autostart.mongo-tools-bin=
app.mongo.autostart.compose-file=docker-compose.mongo.yml
app.mongo.autostart.compose-service=mongo
app.mongo.autostart.wait-seconds=60
app.mongo.autostart.seed.enabled=true
app.mongo.autostart.seed.books=false
# true = bootstrap that bai thi dung han app (mac dinh false = chi canh bao)
app.mongo.autostart.fail-fast=false

#===================================
# REDIS CONFIG
#===================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

#===================================
# RABBITMQ CONFIG
#===================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#===================================
# Name Queue and Exchange
#===================================
app.rabbitmq.recommendation.queue=recommendation_queue
app.rabbitmq.recommendation.exchange=recommendation_exchange
app.rabbitmq.recommendation.routing-key=recommendation_routing_key
