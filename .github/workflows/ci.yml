name: Deploy The Technical United to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo code Bookom về
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup lò Maven
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Nấu code lấy file .jar
      - name: Build file JAR
        run: mvn clean package -DskipTests

      # 4. Đăng nhập Docker Hub (Kho bãi trung gian)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # 5. Đọc Dockerfile, bọc giáp và đẩy lên Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USER }}/bookom-api:latest

      # 6. Bắn file cấu hình (Bản đồ trận địa) sang server Azure
      - name: Copy Compose and Nginx config to Azure
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          source: "docker-compose.yml,nginx.conf"
          target: "/home/${{ secrets.AZURE_USER }}/bookom-deploy"

      # 7. Nhập hồn vào Azure và hô "Búng tay"
      - name: Execute Deploy on Azure VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            # Di chuyển vào thư mục vừa copy file sang
            cd /home/${{ secrets.AZURE_USER }}/bookom-deploy
            
            # Cập nhật code mới nhất từ kho trung gian
            docker-compose pull
            
            # Dựng cả cụm hệ thống lên nền ngầm
            docker-compose up -d